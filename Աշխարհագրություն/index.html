<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Աշխարհագրություն</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f3558'/%3E%3Cpath d='M9 11c3-3 6-2 7 1s-1 5-1 8c-3-1-7-4-6-9zM19 7c3 0 6 2 6 5-3 0-4 2-6 1s-1-4 0-6zM19 19c3-1 6 0 6 3-2 3-5 4-7 3 2-2 1-4 1-6z' fill='%237fd1a8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<div id="siteHeader"></div>
<main id="top">
<section class="hero">
  <i class="cell c1"></i><i class="cell c2"></i><i class="cell c3"></i><i class="cell c4"></i><i class="cell c5"></i>
  <div class="wrap hero-grid">
    <div class="hero-card">
      <p class="kicker" data-i18n="hero_kicker"></p>
      <h1 data-i18n="hero_title"></h1>
      <p class="lead" data-i18n="hero_sub"></p>
      <div class="cta">
        <a class="btn btn-white" href="#explorer" data-i18n="hero_cta"></a>
        <a class="btn btn-ghost" href="#assistant" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <ul class="stats">
      <li><b data-i18n="st1v"></b><span data-i18n="st1"></span></li>
      <li><b data-i18n="st2v"></b><span data-i18n="st2"></span></li>
      <li><b data-i18n="st3v"></b><span data-i18n="st3"></span></li>
    </ul>
  </div>
  <svg class="ecg" viewBox="0 0 1200 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40c50-30 100-30 150 0s100 30 150 0 100-30 150 0 100 30 150 0 100-30 150 0 100 30 150 0 100-30 150 0 100 30 150 0"/></svg>
</section>

<section id="explorer" class="sec">
  <div class="wrap">
    <h2 class="h" data-i18n="ex_title"></h2>
    <p class="sub" data-i18n="ex_sub"></p>

    <div class="viewer">
      <div class="stage-col">
        <div class="stage" id="stageWrap">
          <canvas id="stage" aria-label="3D Britain"></canvas>
          <div class="labels" id="labels" aria-hidden="true"></div>
          <div class="no-gl" id="noGL" hidden><span data-i18n="no_gl"></span></div>
          <div class="stage-top">
            <div class="seg" id="modeSeg">
              <button data-mode="map" aria-pressed="true" data-i18n="mode_map"></button>
              <button data-mode="ben" aria-pressed="false" data-i18n="mode_ben"></button>
            </div>
            <div class="zoom">
              <button id="zIn" aria-label="Zoom in">+</button>
              <button id="zOut" aria-label="Zoom out">−</button>
              <button id="zReset" class="rst" data-i18n="reset"></button>
            </div>
          </div>
          <div class="legend">
            <span><i class="dot" style="background:#1f5f8b"></i><em data-i18n="lg_city"></em></span>
            <span><i class="dot" style="background:#2f9e6b"></i><em data-i18n="lg_nature"></em></span>
            <span><i class="dot" style="background:#d99a2b"></i><em data-i18n="lg_chan"></em></span>
          </div>
          <div class="tip" id="tip" hidden></div>
        </div>
        <div class="controls">
          <label class="tog"><input type="checkbox" data-layer="tunnel" checked><span data-i18n="lay_tunnel"></span></label>
          <label class="tog"><input type="checkbox" data-layer="labels" checked><span data-i18n="lay_labels"></span></label>
          <label class="tog"><input type="checkbox" data-layer="mountains" checked><span data-i18n="lay_mount"></span></label>
          <label class="tog"><input type="checkbox" id="autoRot"><span data-i18n="lay_auto"></span></label>
        </div>
      </div>

      <aside class="side">
        <div class="clockbox card" id="clockBox">
          <p class="lab" id="clkTitle"></p>
          <div class="clk-main"><span class="lab" id="clkLL"></span><b id="clkL">--:--:--</b><small id="clkTz"></small></div>
          <dl class="clk-grid">
            <div><dt id="clkYL"></dt><dd id="clkY">--:--</dd></div>
            <div><dt id="clkNL"></dt><dd id="clkNext">--:--</dd></div>
          </dl>
          <p class="clk-diff" id="clkDiff"></p>
        </div>
        <div class="info" id="info"></div>
        <div class="parts">
          <h3 data-i18n="parts_title"></h3>
          <div id="partsList"></div>
        </div>
      </aside>
    </div>
  </div>
</section>

<section id="assistant" class="sec alt">
  <div class="wrap">
    <h2 class="h" data-i18n="ai_title"></h2>
    <p class="sub" data-i18n="ai_sub"></p>
    <div class="chat card">
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <div class="chat-chips" id="chatChips"></div>
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" type="text" maxlength="300" data-i18n-ph="ai_ph" aria-label="Question">
        <button type="button" class="mic" id="chatMic" aria-label="Ask by voice" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="submit" class="btn btn-solid" data-i18n="ai_send"></button>
      </form>
      <p class="note" data-i18n="ai_note"></p>
    </div>
  </div>
</section>

<section class="sec">
  <div class="wrap">
    <h2 class="h" data-i18n="hl_title"></h2>
    <div class="grid4" id="hlCards"></div>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.1/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/scene.js"></script>
<script src="js/config.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
