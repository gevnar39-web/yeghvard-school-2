<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Երկրաչափություն</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f3558'/%3E%3Cpath d='M7 25V9l18 16z' fill='%237fd1a8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="proofs">
<div id="siteHeader"></div>
<main id="top">
<section class="sec page-sec">
  <div class="wrap">
    <h2 class="h" data-i18n="pr_title"></h2>
    <p class="sub" data-i18n="pr_sub"></p>

    <div class="proof1">
      <div class="card svg-card"><svg id="prSvg" viewBox="0 0 320 320" role="img" aria-label="Rearrangement proof"></svg></div>
      <div class="card">
        <h3 class="h3 first" data-i18n="pr1_title"></h3>
        <p data-i18n="pr1_text"></p>
        <div class="player">
          <button class="btn btn-solid" id="prPlay" data-i18n="pr_play"></button>
          <input type="range" id="prT" min="0" max="100" step="1" value="0" aria-label="Animation">
        </div>
        <p class="note" data-i18n="pr_cap"></p>
      </div>
    </div>

    <div class="two">
      <div class="card">
        <h3 class="h3 first" data-i18n="pr2_title"></h3>
        <ol class="steps">
          <li data-i18n="pr2_s1"></li><li data-i18n="pr2_s2"></li><li data-i18n="pr2_s3"></li><li data-i18n="pr2_s4"></li>
        </ol>
        <svg class="mini" viewBox="0 0 200 200" aria-hidden="true">
          <rect x="10" y="10" width="180" height="180" fill="none" stroke="#0c2d4c" stroke-width="2"/>
          <polygon points="80,10 190,80 120,190 10,120" fill="#f3d9a4" stroke="#d99a2b" stroke-width="2"/>
          <g fill="#dbe9f2" stroke="#1f5f8b" stroke-width="2">
            <polygon points="80,10 190,10 190,80"/><polygon points="190,80 190,190 120,190"/>
            <polygon points="120,190 10,190 10,120"/><polygon points="10,120 10,10 80,10"/>
          </g>
          <text x="100" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#8a5b00">c²</text>
          <text x="45" y="5" text-anchor="middle" font-size="12" fill="#0c2d4c">b</text>
          <text x="135" y="5" text-anchor="middle" font-size="12" fill="#0c2d4c">a</text>
        </svg>
      </div>
      <div class="card">
        <h3 class="h3 first" data-i18n="pr3_title"></h3>
        <p data-i18n="pr3_text"></p>
        <svg class="mini" viewBox="0 0 260 150" aria-hidden="true">
          <polygon points="20,130 240,130 20,20" fill="#eef5f9" stroke="#0c2d4c" stroke-width="2"/>
          <line x1="64" y1="42" x2="20" y2="130" stroke="#2e7d5b" stroke-width="2" stroke-dasharray="5 4"/>
          <text x="130" y="146" text-anchor="middle" font-size="13" fill="#0c2d4c">a</text>
          <text x="9" y="80" text-anchor="middle" font-size="13" fill="#0c2d4c">b</text>
          <text x="150" y="62" font-size="13" fill="#0c2d4c">c = p + q</text>
          <text x="168" y="108" font-size="13" fill="#d99a2b" font-weight="700">p</text>
          <text x="56" y="62" font-size="13" fill="#d99a2b" font-weight="700">q</text>
          <text x="30" y="96" font-size="12" fill="#2e7d5b">h</text>
          <rect x="20" y="118" width="12" height="12" fill="none" stroke="#0c2d4c" stroke-width="1.5"/>
        </svg>
      </div>
    </div>
    <p class="fact" data-i18n="pr_more"></p>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
