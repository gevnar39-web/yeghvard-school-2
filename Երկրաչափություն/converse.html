<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Երկրաչափություն</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f3558'/%3E%3Cpath d='M7 25V9l18 16z' fill='%237fd1a8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="converse">
<div id="siteHeader"></div>
<main id="top">
<section class="sec page-sec">
  <div class="wrap">
    <h2 class="h" data-i18n="cv_title"></h2>
    <p class="sub" data-i18n="cv_text"></p>
    <div class="two">
      <div class="card">
        <svg class="rope" viewBox="0 0 300 220" role="img" aria-label="Rope with 12 knots forming a 3-4-5 triangle" id="ropeSvg"></svg>
        <p data-i18n="cv_rope"></p>
      </div>
      <div class="card">
        <h3 class="h3 first" data-i18n="cv_chk_title"></h3>
        <p class="note" data-i18n="cv_chk_hint"></p>
        <div class="trio">
          <input type="number" id="cx" min="0" step="any" value="6" aria-label="side 1">
          <input type="number" id="cy" min="0" step="any" value="8" aria-label="side 2">
          <input type="number" id="cz" min="0" step="any" value="10" aria-label="side 3">
        </div>
        <button class="btn btn-solid" id="cBtn" data-i18n="cv_chk_btn"></button>
        <p class="result" id="cRes" aria-live="polite"></p>
      </div>
    </div>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
