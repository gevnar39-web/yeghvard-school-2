<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Երկրաչափություն</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f3558'/%3E%3Cpath d='M7 25V9l18 16z' fill='%237fd1a8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<div id="siteHeader"></div>
<main id="top">
<section class="hero">
  <canvas id="heroBg" aria-hidden="true"></canvas>
  <div class="wrap hero-grid">
    <div class="hero-card">
      <p class="kicker" data-i18n="hero_kicker"></p>
      <h1 data-i18n="hero_title"></h1>
      <p class="lead" data-i18n="hero_sub"></p>
      <div class="cta">
        <a class="btn btn-white" href="theorem.html" data-i18n="hero_cta"></a>
        <a class="btn btn-ghost" href="pythagoras.html" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <div class="hero-side">
      <div class="hero-viz">
        <svg id="heroSvg" viewBox="0 0 360 360" role="img" aria-label="Animated right triangle with squares"></svg>
        <div class="live" id="heroLive"></div>
      </div>
      <ul class="stats">
        <li><b data-i18n="st1v"></b><span data-i18n="st1"></span></li>
        <li><b data-i18n="st2v"></b><span data-i18n="st2"></span></li>
        <li><b data-i18n="st3v"></b><span data-i18n="st3"></span></li>
      </ul>
    </div>
  </div>
</section>
<section id="ai" class="sec alt">
  <div class="wrap">
    <h2 class="h" data-i18n="ai_title"></h2>
    <p class="sub" data-i18n="ai_sub"></p>
    <div class="chat card">
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <div class="chips chat-chips" id="chatChips"></div>
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" type="text" maxlength="300" data-i18n-ph="ai_ph" aria-label="Question">
        <button type="submit" class="btn btn-solid" data-i18n="ai_send"></button>
      </form>
      <p class="note" data-i18n="ai_note"></p>
    </div>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script src="js/hero.js"></script>
<script src="js/config.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
