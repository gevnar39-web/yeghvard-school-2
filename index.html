<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Եղվարդի N 2 հիմնական դպրոց</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/school.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#top"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 4l12 7v2H4v-2zM7 15h4v10H7zm7 0h4v10h-4zm7 0h4v10h-4z" fill="#2e7d5b"/></svg><b data-i18n="brand"></b></a>
  <nav class="nav">
    <a href="#about" data-i18n="n_about"></a>
    <a href="#where" data-i18n="n_where"></a>
    <a href="#projects" data-i18n="n_proj"></a>
    <a href="#letter" data-i18n="n_letter"></a>
  </nav>
  <div class="lang" id="lang">
    <button data-lang="hy" aria-pressed="true">HY</button><button data-lang="ru" aria-pressed="false">RU</button><button data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-text">
      <p class="kicker" data-i18n="kicker"></p>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="cta">
        <a class="btn btn-white" href="#projects" data-i18n="cta1"></a>
        <a class="btn btn-ghost" href="#letter" data-i18n="cta2"></a>
      </div>
    </div>
    <figure class="photo">
      <img src="shared/img/school.jpg" alt="" onerror="this.onerror=null;this.src='shared/img/yeghvard.jpg';document.getElementById('photoCap').hidden=false">
      <figcaption id="photoCap" hidden data-i18n="photo_cap"></figcaption>
    </figure>
  </div>
</section>

<section id="about" class="sec">
  <div class="wrap">
    <h2 class="h" data-i18n="about_t"></h2>
    <p class="sub" data-i18n="about_x"></p>
    <ul class="facts">
      <li><b>1962</b><span data-i18n="f_year"></span></li>
      <li><b>539</b><span data-i18n="f_pupils"></span></li>
      <li><b>43</b><span data-i18n="f_teachers"></span></li>
      <li><b>24</b><span data-i18n="f_rooms"></span></li>
      <li><b>3</b><span data-i18n="f_labs"></span></li>
      <li><b>2</b><span data-i18n="f_gyms"></span></li>
    </ul>
    <p class="note" data-i18n="src_note"></p>
  </div>
</section>

<section id="where" class="sec alt">
  <div class="wrap two">
    <div>
      <h2 class="h" data-i18n="where_t"></h2>
      <dl class="info">
        <div><dt data-i18n="l_addr"></dt><dd data-i18n="v_addr"></dd></div>
        <div><dt data-i18n="l_phone"></dt><dd><a href="tel:+37422421384">(0224) 2-13-84</a>, <a href="tel:+37498033176">098 03 31 76</a></dd></div>
        <div><dt data-i18n="l_mail"></dt><dd><a href="mailto:yeghvard2@schools.am">yeghvard2@schools.am</a></dd></div>
        <div><dt data-i18n="l_dir"></dt><dd data-i18n="v_dir"></dd></div>
        <div><dt data-i18n="l_type"></dt><dd data-i18n="v_type"></dd></div>
      </dl>
      <a class="btn btn-solid" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Yeghvard+Safaryan+88" data-i18n="map_btn"></a>
    </div>
    <div class="card about-town">
      <h3 data-i18n="town_t"></h3>
      <p data-i18n="town_x"></p>
    </div>
  </div>
</section>

<section id="projects" class="sec">
  <div class="wrap">
    <h2 class="h" data-i18n="proj_t"></h2>
    <p class="sub" data-i18n="proj_x"></p>
    <div class="grid3">
      <a class="card proj" href="Աշխարհագրություն/index.html"><span class="ic">🌍</span><h3 data-i18n="p_geo"></h3><p data-i18n="p_geo_x"></p></a>
      <a class="card proj" href="Կենսաբանություն/index.html"><span class="ic">🫀</span><h3 data-i18n="p_bio"></h3><p data-i18n="p_bio_x"></p></a>
      <a class="card proj" href="Երկրաչափություն/index.html"><span class="ic">📐</span><h3 data-i18n="p_geom"></h3><p data-i18n="p_geom_x"></p></a>
    </div>
  </div>
</section>

<section id="letter" class="sec alt">
  <div class="wrap narrow">
    <h2 class="h" data-i18n="let_t"></h2>
    <p class="sub" data-i18n="let_x"></p>
    <form class="card letter" id="letterForm" autocomplete="off">
      <textarea id="letterText" rows="6" maxlength="2000" required data-i18n-ph="let_ph" aria-label="Letter"></textarea>
      <div class="let-row"><span class="note" id="letterCount">0 / 2000</span><button class="btn btn-solid" type="submit" id="letterBtn" data-i18n="let_send"></button></div>
      <p class="result" id="letterRes" aria-live="polite"></p>
      <p class="note" data-i18n="let_priv"></p>
    </form>
  </div>
</section>
</main>

<footer class="foot"><div class="wrap"><b data-i18n="brand"></b> · <span data-i18n="foot"></span></div></footer>
<script src="shared/config.js"></script>
<script src="shared/school.js"></script>
</body>
</html>
