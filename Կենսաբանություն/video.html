<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Կենսաբանություն</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29C5 20 3 14 3 10a7 7 0 0 1 13-3.5A7 7 0 0 1 29 10c0 4-2 10-13 19z' fill='%23d7263d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="video">
<div id="siteHeader"></div>
<main id="top">
<section class="pagehead"><div class="wrap"><h1 data-i18n="nav_video"></h1></div></section>
<section class="sec">
  <div class="wrap">
    <h2 class="h" data-i18n="vd_anim_t"></h2>
    <p class="sub" data-i18n="vd_anim_sub"></p>
    <div class="story paused" id="story">
      <div class="story-stage">
        <svg id="stSvg" viewBox="0 0 800 450" role="img" aria-label="Forssmann"></svg>
        <div class="story-chip" id="stChip"></div>
        <button type="button" class="story-big" id="stBig" aria-label="Play">▶</button>
      </div>
      <div class="story-cap" id="stCap" aria-live="polite"></div>
      <div class="story-ctl">
        <button type="button" class="btn btn-solid" id="stPlay"></button>
        <button type="button" class="btn btn-ghost-d" id="stPrev"></button>
        <button type="button" class="btn btn-ghost-d" id="stNext"></button>
        <button type="button" class="btn btn-ghost-d" id="stSound" aria-label="Sound">🔊</button>
        <div class="story-prog" id="stProg"></div>
      </div>
    </div>

    <h2 class="h mt2" data-i18n="vd_heart_t"></h2>
    <p class="sub" data-i18n="vd_heart_sub"></p>
    <div class="video-wrap">
      <video controls preload="metadata" playsinline>
        <source src="video/heart-work.mp4" type="video/mp4">
      </video>
    </div>

    <!-- optional extra video: shown only when the file video/circulatory.mp4 exists -->
    <div class="vid-opt" hidden>
      <h2 class="h mt2" data-i18n="vd_video_t"></h2>
      <p class="sub" data-i18n="vd_sub"></p>
      <div class="video-wrap">
        <video controls preload="metadata" playsinline>
          <source src="video/circulatory.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="js/data.js"></script>
<script src="js/data-extra.js"></script>
<script src="js/app.js"></script>
<script src="js/extra.js"></script>
<script src="js/story.js"></script>
</body>
</html>
