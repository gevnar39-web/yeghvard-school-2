<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Կենսաբանություն</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29C5 20 3 14 3 10a7 7 0 0 1 13-3.5A7 7 0 0 1 29 10c0 4-2 10-13 19z' fill='%23d7263d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="ecg">
<div id="siteHeader"></div>
<main id="top">
<section class="pagehead"><div class="wrap"><h1 data-i18n="nav_ecg"></h1></div></section>

<section class="sec">
  <div class="wrap">
    <h2 class="h" data-i18n="ecg_title"></h2>
    <p class="sub" data-i18n="ecg_sub"></p>

    <div class="ecg-board">
      <div class="ecg-screen" id="ecgScreen">
        <canvas id="ecgCanvas" aria-label="ECG"></canvas>
        <div class="ecg-hud">
          <div class="hr"><span class="heart" id="ecgHeart">♥</span><b id="ecgBpm">72</b><small data-i18n="unit_bpm"></small></div>
          <div class="ecg-tag" id="ecgTag"></div>
        </div>
      </div>
      <div class="ecg-ctl">
        <h3 data-i18n="ecg_pick"></h3>
        <div class="rgrid" id="rGrid"></div>
        <label class="bpm" id="ecgRateBox"><span><span data-i18n="bpm"></span>: <b id="ecgRateVal">72</b> <span data-i18n="unit_bpm"></span></span>
          <input type="range" id="ecgRate" min="35" max="180" value="72"></label>
      </div>
    </div>

    <div class="card ecg-detail" id="rDetail"></div>

    <h2 class="h mt" data-i18n="ecg_wave"></h2>
    <div class="card beat-card"><div id="beatSvg"></div><ul class="wave-list" id="waveList"></ul></div>
    <p class="note" data-i18n="ecg_note"></p>
  </div>
</section>
</main>
<div id="siteFooter"></div>
<script src="js/data.js"></script>
<script src="js/data-extra.js"></script>
<script src="js/app.js"></script>
<script src="js/ecg.js"></script>
</body>
</html>
